<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1923" />
  <title>تطبيق العباسي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="bg-surface text-white overflow-hidden">

  <!-- SPLASH SCREEN -->
  <div id="splash" class="splash-screen">
    <div class="splash-bg"></div>
    <div class="splash-content">
      <div class="splash-logo-ring">
        <div class="splash-logo-inner">
          <span class="splash-icon">🛒</span>
        </div>
      </div>
      <h1 class="splash-title">العباسي</h1>
      <p class="splash-sub">سوبرماركت العائلة</p>
      <div class="splash-loader">
        <div class="splash-loader-bar"></div>
      </div>
    </div>
  </div>

  <!-- APP ROOT -->
  <div id="app" class="hidden h-screen w-full overflow-hidden">

    <!-- LOGIN SCREEN -->
    <div id="screen-login" class="screen active"></div>

    <!-- CUSTOMER DASHBOARD -->
    <div id="screen-customer" class="screen hidden"></div>

    <!-- ADMIN DASHBOARD -->
    <div id="screen-admin" class="screen hidden"></div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
